<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Watch Live | Varsha &amp; Chellam Srinivasan</title>
<meta name="theme-color" content="#8A1620">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--hd:#8A1620;--ac:#B8861F;--fg:#3A1015;--fg2:#6A3B34;--ln:rgba(138,22,32,.24);--shadow:rgba(90,15,27,.35);--f-disp:'Playfair Display',Georgia,serif;--f-en:'Lora',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;color:var(--fg);font-family:var(--f-en);font-size:1.12rem;line-height:1.7;background:#EAD8BC;-webkit-font-smoothing:antialiased;overflow-x:clip}
.bg{position:fixed;inset:0;z-index:-1;background:#EAD8BC url(images/site-bg.jpg) center top/cover no-repeat}
img{display:block;max-width:100%}
:focus-visible{outline:2.5px solid #F39A1E;outline-offset:3px;border-radius:4px}
.top{text-align:center;padding:clamp(28px,6vh,60px) 16px 0}
.brand{font-family:var(--f-disp);font-style:italic;font-weight:700;font-size:2.2rem;color:var(--hd);line-height:1}
.brand span{color:#E07B10}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);color:var(--hd);line-height:1.2;margin-top:.5rem}
.sub{max-width:34em;margin:.8rem auto 0;color:var(--fg2)}
.wrap{width:min(900px,92vw);margin:clamp(24px,5vh,46px) auto clamp(40px,8vh,80px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.8em 1.6em;border-radius:999px;border:1.5px solid var(--hd);color:var(--hd);background:transparent;font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.3;transition:background .3s,color .3s,box-shadow .3s}
.btn:hover{background:var(--hd);color:#FFF3D6}
.btn.solid{background:linear-gradient(180deg,#A8242C,#7B1118);color:#FFF3D6;border-color:transparent;box-shadow:0 10px 26px -10px var(--shadow)}
.btn.solid:hover{box-shadow:0 14px 34px -10px rgba(90,15,27,.6)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:1.1em;height:1.1em;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.card{padding:clamp(22px,4vw,44px);background:rgba(255,251,241,.86);border:1px solid var(--ln);border-radius:14px;box-shadow:0 30px 60px -34px var(--shadow)}
.fld{margin-bottom:1.4rem}
.fld>label{display:block;font-weight:600;color:var(--hd);margin-bottom:.45rem}
.fld input[type=text]{width:100%;padding:.75em 1.1em;border-radius:14px;border:1.5px solid var(--ln);background:#fff;color:var(--fg);font:inherit;font-size:1.08rem}
.fld input:focus{outline:none;border-color:#F39A1E;box-shadow:0 0 0 5px rgba(243,154,30,.28)}
.fld input.bad{border-color:#B3261E}
.player{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1.5px solid #D7A53A;background:#0b0406;box-shadow:0 30px 60px -30px var(--shadow),0 0 0 6px rgba(250,240,220,.9),0 0 0 7.5px rgba(184,134,31,.55)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.soon{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#FFF6E2;background:radial-gradient(70% 70% at 50% 40%,#5A0F1B,#240609);font-family:var(--f-disp);font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.4}
.acts{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:clamp(26px,4vw,40px)}
.when{margin-top:.8rem;font-weight:600;color:var(--hd)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header class="top"><p class="brand">V <span>&amp;</span> C</p>
  <h1>Watch the Muhurtham Live</h1>
  <p class="when">Sunday, 1 November 2026 &middot; 10.30 a.m. IST</p>
  <p class="sub">Thank you for joining us from wherever you are. Your blessings mean the world to the couple.</p>
</header>
<main class="wrap">
  <div class="player" id="player"></div>
  <div class="acts">
    <a class="btn solid" id="ytLink" target="_blank" rel="noopener" href="https://www.youtube.com/">Open on YouTube</a>
  </div>
</main>
<script src="config.js"></script>
<script>
(function(){
'use strict';
const url=(window.WEDDING_CONFIG||{}).YOUTUBE_URL||'', m=url.match(/(?:[?&]v=|youtu\.be\/|\/live\/|\/embed\/)([A-Za-z0-9_-]{11})/), id=m?m[1]:'';
const player=document.getElementById('player');
if(id&&!/^X+$/i.test(id)){
  const f=document.createElement('iframe');
  f.src='https://www.youtube.com/embed/'+id+'?rel=0&modestbranding=1&playsinline=1'+(location.protocol.startsWith('http')?'&origin='+encodeURIComponent(location.origin):'');
  f.referrerPolicy='strict-origin-when-cross-origin';
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen=true; f.title='Wedding live stream';
  player.appendChild(f); document.getElementById('ytLink').href=url;
}else{
  player.innerHTML='<div class="soon">The live stream will appear here.<br>Please check back on the wedding day.</div>';
  document.getElementById('ytLink').style.display='none';
}
})();
</script>
</body>
</html>
